<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E58E00"/>
      <stop offset="50%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#FFC837"/>
    </linearGradient>

    <linearGradient id="greenRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3FA535"/>
      <stop offset="100%" stop-color="#70C041"/>
    </linearGradient>

    <linearGradient id="waterFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AEEF"/>
      <stop offset="40%" stop-color="#29B6F6"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>

    <linearGradient id="colonTissue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F28D79"/>
      <stop offset="50%" stop-color="#D9634C"/>
      <stop offset="100%" stop-color="#B8422E"/>
    </linearGradient>

    <linearGradient id="colonOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A1887F"/>
      <stop offset="50%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#6D4C41"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="60%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#81C784"/>
    </linearGradient>

    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>

    <!-- Filter for soft drop shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#004D40" flood-opacity="0.18"/>
    </filter>

    <!-- Path for circular text: ગાયત્રી હાઇડ્રો કોલોન થેરાપી -->
    <path id="textArcOuter" d="M 55,215 A 195,195 0 1,1 445,215" fill="none" />
    <!-- Path for inner circular text: હાઇડ્રો કોલોન -->
    <path id="textArcInner" d="M 105,215 A 145,145 0 1,1 395,215" fill="none" />
  </defs>

  <!-- Circular Outer Rings -->
  <g id="EmblemBackground" filter="url(#badgeShadow)">
    <!-- White Base Disc -->
    <circle cx="250" cy="215" r="198" fill="#FFFFFF" />

    <!-- Outer Gold Ring -->
    <circle cx="250" cy="215" r="192" fill="none" stroke="url(#goldRing)" stroke-width="9" stroke-linecap="round"/>

    <!-- Inner Green Ring -->
    <circle cx="250" cy="215" r="148" fill="none" stroke="url(#greenRing)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Curved Text Outer Ring (Gujarati) -->
  <text font-family="'Noto Sans Gujarati', 'Gujarati Sangam MN', 'Shruti', 'Segoe UI', Arial, sans-serif"
        font-size="28" font-weight="900" fill="#1A237E" letter-spacing="3.5">
    <textPath href="#textArcOuter" startOffset="50%" text-anchor="middle">
      ગાયત્રી હાઇડ્રો કોલોન થેરાપી
    </textPath>
  </text>

  <!-- Curved Text Inner Ring (Gujarati) -->
  <text font-family="'Noto Sans Gujarati', 'Gujarati Sangam MN', 'Shruti', 'Segoe UI', Arial, sans-serif"
        font-size="24" font-weight="800" fill="#00695C" letter-spacing="3">
    <textPath href="#textArcInner" startOffset="50%" text-anchor="middle">
      હાઇડ્રો કોલોન
    </textPath>
  </text>

  <!-- Central Illustrated Artwork -->
  <g id="CenterArt" transform="translate(0, 5)">
    <!-- Rising Sun Rays Behind Leaf -->
    <g id="SunRays" transform="translate(305, 175)">
      <circle cx="0" cy="0" r="16" fill="url(#sunGrad)"/>
      <path d="M 0,-24 L 0,-18 M 17,-17 L 13,-13 M 24,0 L 18,0 M 17,17 L 13,13 M -17,-17 L -13,-13 M -24,0 L -18,0" 
            stroke="#FFB300" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Cleansing Water Stream (Left Side of Colon) -->
    <g id="WaterWaves">
      <!-- Outer Splash -->
      <path d="M 235,145 C 195,145 170,175 170,215 C 170,250 190,280 230,290 C 205,280 188,255 188,220 C 188,185 208,160 235,145 Z" 
            fill="url(#waterFlow)" opacity="0.85"/>
      <!-- Inner Dynamic Wave -->
      <path d="M 245,155 C 215,155 195,180 195,215 C 195,245 210,270 240,278 C 220,268 208,245 208,220 C 208,190 225,168 245,155 Z" 
            fill="#80D8FF"/>
      <!-- Water Drops -->
      <circle cx="178" cy="170" r="5" fill="#40C4FF" />
      <circle cx="168" cy="200" r="6.5" fill="#00B0FF" />
      <circle cx="175" cy="235" r="4.5" fill="#80D8FF" />
      <circle cx="215" cy="140" r="4" fill="#00B0FF" />
    </g>

    <!-- Anatomical Colon Illustration (Large & Small Intestine) -->
    <g id="ColonDiagram">
      <!-- Large Intestine Outer Frame (Ascending, Transverse, Descending) -->
      <!-- Transverse Colon (Top arch) -->
      <path d="M 215,170 C 235,162 265,162 285,170 C 290,173 293,178 290,183 C 285,188 275,182 250,182 C 225,182 215,188 210,183 C 207,178 210,173 215,170 Z" 
            fill="url(#colonOuter)" stroke="#4E342E" stroke-width="2"/>
      
      <!-- Ascending Colon (Left side) -->
      <path d="M 210,180 C 202,190 202,235 212,250 C 216,252 218,248 217,242 C 214,230 214,195 217,185 Z" 
            fill="url(#colonOuter)" stroke="#4E342E" stroke-width="1.8"/>

      <!-- Descending Colon (Right side) -->
      <path d="M 290,180 C 298,190 298,235 288,250 C 284,252 282,248 283,242 C 286,230 286,195 283,185 Z" 
            fill="url(#colonOuter)" stroke="#4E342E" stroke-width="1.8"/>

      <!-- Sigmoid / Rectum (Bottom loop) -->
      <path d="M 288,250 C 280,265 260,270 248,278 C 242,282 240,288 245,292 C 252,288 268,278 278,260 Z" 
            fill="url(#colonOuter)" stroke="#4E342E" stroke-width="1.5"/>

      <!-- Inner Intestinal Folds (Small Intestine in vibrant healthy peach/salmon) -->
      <g id="SmallIntestines" stroke="#B71C1C" stroke-width="1.2">
        <path d="M 225,195 Q 235,188 248,195 Q 262,202 272,195" fill="url(#colonTissue)"/>
        <path d="M 222,205 Q 237,215 250,205 Q 265,198 276,206" fill="url(#colonTissue)"/>
        <path d="M 224,217 Q 235,210 250,218 Q 265,225 274,217" fill="url(#colonTissue)"/>
        <path d="M 226,229 Q 240,238 252,229 Q 264,222 272,230" fill="url(#colonTissue)"/>
        <path d="M 230,240 Q 244,248 255,241 Q 265,236 268,242" fill="url(#colonTissue)"/>
      </g>
    </g>

    <!-- Herbal Green Wellness Leaf (Right Side of Colon) -->
    <g id="HerbalLeaf" transform="translate(290, 185)">
      <!-- Leaf Blade -->
      <path d="M 12,55 C 38,45 42,12 12,0 C -15,12 -10,45 12,55 Z" 
            fill="url(#leafGrad)" stroke="#1B5E20" stroke-width="2"/>
      <!-- Leaf Center Vein -->
      <path d="M 12,52 L 12,8" stroke="#E8F5E9" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Side Veins -->
      <path d="M 12,40 Q 22,34 26,30 M 12,40 Q 2,34 -2,30 M 12,26 Q 22,20 25,16 M 12,26 Q 2,20 -1,16" 
            stroke="#E8F5E9" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Bottom Location Tag: • રાજકોટ • -->
  <text x="250" y="380" 
        text-anchor="middle" 
        font-family="'Noto Sans Gujarati', 'Gujarati Sangam MN', 'Segoe UI', Arial, sans-serif" 
        font-size="22" 
        font-weight="900" 
        fill="#1A237E" 
        letter-spacing="5">
    • રાજકોટ •
  </text>

  <!-- Clinic Name in English Typography Below Circle -->
  <text x="250" y="445" 
        text-anchor="middle" 
        font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif" 
        font-size="34" 
        font-weight="800" 
        fill="#00796B" 
        letter-spacing="0.5">
    Gayatri Hydrocolon
  </text>

  <!-- Subtitle with Magenta / Pink Font and Leaves -->
  <g transform="translate(250, 480)">
    <!-- Subtitle Text -->
    <text x="0" y="0" 
          text-anchor="middle" 
          font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif" 
          font-size="24" 
          font-weight="700" 
          fill="#D81B60" 
          letter-spacing="1.2">
      Therapy clinic
    </text>

    <!-- Left Small Green Leaf -->
    <path d="M -115,-3 C -105,-15 -90,-8 -92,4 C -102,6 -112,5 -115,-3 Z" 
          fill="#00897B"/>
    <!-- Right Small Green Leaf -->
    <path d="M 115,-3 C 105,-15 90,-8 92,4 C 102,6 112,5 115,-3 Z" 
          fill="#00897B"/>
  </g>

  <!-- Bottom Tagline in Gujarati -->
  <text x="250" y="525" 
        text-anchor="middle" 
        font-family="'Noto Sans Gujarati', 'Gujarati Sangam MN', 'Segoe UI', sans-serif" 
        font-size="15" 
        font-weight="700" 
        fill="#004D40" 
        letter-spacing="1">
    સ્વચ્છ અંદર  |  સ્વસ્થ બહાર  |  ખુશહાલ જીવન
  </text>

  <!-- Bottom Tagline in English -->
  <text x="250" y="550" 
        text-anchor="middle" 
        font-family="'Poppins', sans-serif" 
        font-size="11.5" 
        font-weight="700" 
        fill="#455A64" 
        letter-spacing="3.5">
    A CLEANER YOU A BRIGHTER TOMORROW
  </text>
</svg>
